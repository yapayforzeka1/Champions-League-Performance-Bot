name: Model Transition Tests (No AI)

on:
  workflow_dispatch:
  push:
    paths:
      - "config.py"
      - "performance_engine.py"
      - "weekly_report.py"
      - "tests/**"
      - ".github/workflows/model-transition-tests.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
